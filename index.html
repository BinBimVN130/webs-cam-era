<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --accent: #ffffff;
      --danger: #ff3b30;
      --text: #ffffff;
      --muted: #8e8e93;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

    /* ===== Preview Area ===== */
    #preview-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.3s ease;
    }

    #canvas {
      display: none;
    }

    /* Flash overlay on preview */
    #flash-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    #flash-overlay.active {
      opacity: 0.35;
    }

    /* No camera state */
    #no-camera {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #c8c8c8;
      color: #333;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    #no-camera.hidden {
      display: none;
    }

    #no-camera .icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    #no-camera h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #no-camera p {
      font-size: 14px;
      color: #666;
      max-width: 280px;
    }

    /* Countdown */
    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      font-size: 140px;
      font-weight: 200;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    #countdown.show {
      display: flex;
    }

    /* Recording timer */
    #rec-timer {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 20;
      display: none;
      letter-spacing: 1px;
    }

    #rec-timer.recording {
      color: #ff3b30;
    }

    /* QR instruction */
    #qr-hint {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 15;
      display: none;
      white-space: nowrap;
    }

    /* Shutter flash effect (iOS style) */
    #shutter-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.08s ease;
    }

    /* Fullscreen flash for capture */
    #fullscreen-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.35s ease;
    }

    /* ===== Left Controls ===== */
    .left-controls {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 30;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(40,40,40,0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      position: relative;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn.active {
      background: #fff;
      color: #000;
    }

    .ctrl-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Color picker button */
    #color-btn {
      background: #fff;
      border: 2px solid rgba(255,255,255,0.3);
    }

    #color-btn .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.15);
    }

    /* Color palette */
    #color-palette {
      position: absolute;
      left: 60px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30,30,30,0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 14px;
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      z-index: 40;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #color-palette.show {
      display: grid;
    }

    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .color-swatch:hover,
    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.12);
    }

    /* Timer menu */
    #timer-menu {
      position: absolute;
      left: 60px;
      bottom: 0;
      background: rgba(30,30,30,0.95);
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 40;
      min-width: 80px;
    }

    #timer-menu.show {
      display: flex;
    }

    .timer-opt {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .timer-opt:hover,
    .timer-opt.active {
      background: rgba(255,255,255,0.15);
    }

    /* Toast notification */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(30,30,30,0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Right Controls ===== */
    .right-controls {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 30;
    }

    /* Mode switcher */
    .mode-switcher {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(30,30,30,0.8);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 8px;
    }

    .mode-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #fff;
      color: #000;
    }

    .mode-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Shutter button */
    #shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      margin: 8px 0;
    }

    #shutter:active {
      transform: scale(0.92);
    }

    #shutter.video-mode {
      background: transparent;
      border-color: #fff;
    }

    #shutter.video-mode::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #ff3b30;
      transition: all 0.2s ease;
    }

    #shutter.recording {
      border-color: #ff3b30;
    }

    #shutter.recording::after {
      inset: 18px;
      border-radius: 6px;
      background: #ff3b30;
    }

    /* Flip buttons */
    .flip-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(40,40,40,0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .flip-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ===== QR Result Popup ===== */
    #qr-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 20px;
    }

    #qr-popup.show {
      display: flex;
    }

    .qr-box {
      background: #1c1c1e;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .qr-box h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .qr-box textarea {
      width: 100%;
      min-height: 100px;
      background: #2c2c2e;
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      margin-bottom: 16px;
      font-family: inherit;
    }

    .qr-actions {
      display: flex;
      gap: 10px;
    }

    .qr-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .qr-actions .copy-btn {
      background: #0a84ff;
      color: #fff;
    }

    .qr-actions .close-btn {
      background: #3a3a3c;
      color: #fff;
    }

    /* Loading spinner for camera */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .left-controls { left: 10px; gap: 14px; }
      .right-controls { right: 10px; gap: 12px; }
      #shutter { width: 64px; height: 64px; }
      #countdown { font-size: 110px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="preview-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="flash-overlay"></div>

      <div id="no-camera">
        <div class="icon">📹</div>
        <h2>Không có camera</h2>
        <p>Kiểm tra lại quyền của trình duyệt, cáp camera,...</p>
      </div>

      <div id="countdown"></div>
      <div id="rec-timer">00:00:00</div>
      <div id="qr-hint">Đưa QR vào khung hình và chụp ảnh</div>
    </div>

    <!-- Left controls -->
    <div class="left-controls">
      <button class="ctrl-btn" id="color-btn" title="Chọn màu đèn">
        <div class="dot" id="color-dot"></div>
      </button>
      <button class="ctrl-btn" id="flash-btn" title="Đèn flash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="timer-btn" title="Hẹn giờ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
      </button>
    </div>

    <!-- Color palette -->
    <div id="color-palette">
      <div class="color-swatch selected" data-color="#ffffff" style="background:#ffffff"></div>
      <div class="color-swatch" data-color="#ffcc00" style="background:#ffcc00"></div>
      <div class="color-swatch" data-color="#ff9500" style="background:#ff9500"></div>
      <div class="color-swatch" data-color="#007aff" style="background:#007aff"></div>
      <div class="color-swatch" data-color="#ff3b30" style="background:#ff3b30"></div>
      <div class="color-swatch" data-color="#af52de" style="background:#af52de"></div>
      <div class="color-swatch" data-color="#34c759" style="background:#34c759"></div>
      <div class="color-swatch" data-color="#ff2d55" style="background:#ff2d55"></div>
    </div>

    <!-- Timer menu -->
    <div id="timer-menu">
      <button class="timer-opt" data-sec="0">Tắt</button>
      <button class="timer-opt" data-sec="3">3s</button>
      <button class="timer-opt" data-sec="5">5s</button>
      <button class="timer-opt" data-sec="10">10s</button>
      <button class="timer-opt" data-sec="15">15s</button>
    </div>

    <!-- Right controls -->
    <div class="right-controls">
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="photo" title="Chụp ảnh">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
        </button>
        <button class="mode-btn" data-mode="video" title="Quay video">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </button>
        <button class="mode-btn" data-mode="qr" title="Quét QR">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h2v2h-2zM15 15h2v2h-2zM13 17h2v2h-2zM15 19h2v2h-2zM17 13h2v2h-2zM19 15h2v2h-2zM17 17h2v2h-2zM19 19h2v2h-2z"/>
          </svg>
        </button>
      </div>

      <button id="shutter" title="Chụp / Quay"></button>

      <button class="flip-btn" id="flip-v" title="Lật đứng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>
        </svg>
      </button>
      <button class="flip-btn" id="flip-h" title="Lật ngang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>
        </svg>
      </button>
    </div>

    <!-- QR Popup -->
    <div id="qr-popup">
      <div class="qr-box">
        <h3>Kết quả quét QR</h3>
        <textarea id="qr-result" readonly></textarea>
        <div class="qr-actions">
          <button class="copy-btn" id="qr-copy">Sao chép</button>
          <button class="close-btn" id="qr-close">Đóng</button>
        </div>
      </div>
    </div>

    <div id="shutter-flash"></div>
    <div id="fullscreen-flash"></div>
    <div id="toast"></div>
  </div>

  <script>
    // ===================== State =====================
    const state = {
      stream: null,
      mode: 'photo',          // photo | video | qr
      isRecording: false,
      mediaRecorder: null,
      recordedChunks: [],
      flipH: false,
      flipV: false,
      flashOn: false,
      flashColor: '#ffffff',
      timerSec: 0,
      isCounting: false,
      facingMode: 'environment'
    };

    // ===================== DOM =====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const noCamera = document.getElementById('no-camera');
    const flashOverlay = document.getElementById('flash-overlay');
    const countdownEl = document.getElementById('countdown');
    const recTimerEl = document.getElementById('rec-timer');
    const qrHint = document.getElementById('qr-hint');
    const shutter = document.getElementById('shutter');
    const flashBtn = document.getElementById('flash-btn');
    const colorBtn = document.getElementById('color-btn');
    const colorDot = document.getElementById('color-dot');
    const colorPalette = document.getElementById('color-palette');
    const timerBtn = document.getElementById('timer-btn');
    const timerMenu = document.getElementById('timer-menu');
    const qrPopup = document.getElementById('qr-popup');
    const qrResult = document.getElementById('qr-result');
    const toast = document.getElementById('toast');
    const shutterFlash = document.getElementById('shutter-flash');
    const fullscreenFlash = document.getElementById('fullscreen-flash');

    // ===================== Utils =====================
    function showToast(msg, duration = 2500) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    function playBeep(freq = 800, duration = 0.12) {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + duration);
        osc.start(ac.currentTime);
        osc.stop(ac.currentTime + duration);
      } catch (e) {}
    }

    function playShutterSound() {
      playBeep(1200, 0.08);
      setTimeout(() => playBeep(900, 0.06), 60);
    }

    function applyTransform() {
      let scaleX = state.flipH ? -1 : 1;
      let scaleY = state.flipV ? -1 : 1;
      video.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    function updateFlashOverlay() {
      if (state.flashOn) {
        flashOverlay.style.background = state.flashColor;
        flashOverlay.classList.add('active');
      } else {
        flashOverlay.classList.remove('active');
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ===================== Camera =====================
    async function startCamera() {
      try {
        if (state.stream) {
          state.stream.getTracks().forEach(t => t.stop());
        }

        const constraints = {
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: state.mode === 'video'
        };

        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.stream;
        noCamera.classList.add('hidden');

        // Wait for video ready
        await new Promise(r => {
          video.onloadedmetadata = () => {
            video.play();
            r();
          };
        });
      } catch (err) {
        console.error(err);
        noCamera.classList.remove('hidden');
        showToast('Không thể truy cập camera. Hãy kiểm tra quyền trình duyệt.');
      }
    }

    // ===================== Capture Photo =====================
    async function capturePhoto() {
      if (!state.stream || state.isCounting) return;

      // Timer countdown
      if (state.timerSec > 0) {
        state.isCounting = true;
        countdownEl.classList.add('show');
        for (let i = state.timerSec; i > 0; i--) {
          countdownEl.textContent = i;
          playBeep(900, 0.1);
          await new Promise(r => setTimeout(r, 1000));
        }
        countdownEl.classList.remove('show');
        state.isCounting = false;
      }

      // Flash fullscreen effect
      if (state.flashOn) {
        fullscreenFlash.style.background = state.flashColor;
        fullscreenFlash.style.opacity = '1';
        await new Promise(r => setTimeout(r, 180));
      }

      // Draw to canvas
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;

      ctx.save();
      // Apply flips
      if (state.flipH || state.flipV) {
        ctx.translate(w / 2, h / 2);
        ctx.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1);
        ctx.translate(-w / 2, -h / 2);
      }
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();

      // iOS shutter effect
      shutterFlash.style.opacity = '1';
      playShutterSound();
      setTimeout(() => {
        shutterFlash.style.opacity = '0';
      }, 80);

      // Fade out fullscreen flash
      if (state.flashOn) {
        setTimeout(() => {
          fullscreenFlash.style.opacity = '0';
        }, 100);
      }

      // QR mode
      if (state.mode === 'qr') {
        const imageData = ctx.getImageData(0, 0, w, h);
        const code = jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });
        if (code) {
          qrResult.value = code.data;
          qrPopup.classList.add('show');
        } else {
          showToast('Không tìm thấy mã QR. Hãy đưa QR vào khung hình rõ hơn.');
        }
        return;
      }

      // Photo mode → download PNG
      canvas.toBlob(blob => {
        if (blob) {
          const name = `photo_${Date.now()}.png`;
          downloadBlob(blob, name);
          showToast('Đã lưu ảnh');
        }
      }, 'image/png');
    }

    // ===================== Video Recording =====================
    function startRecording() {
      if (!state.stream || state.isRecording) return;

      state.recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9,opus' };
      try {
        state.mediaRecorder = new MediaRecorder(state.stream, options);
      } catch (e) {
        try {
          state.mediaRecorder = new MediaRecorder(state.stream, { mimeType: 'video/webm' });
        } catch (e2) {
          showToast('Trình duyệt không hỗ trợ quay video');
          return;
        }
      }

      state.mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) state.recordedChunks.push(e.data);
      };

      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
        const name = `video_${Date.now()}.webm`;
        downloadBlob(blob, name);
        showToast('Đã lưu video');
        state.recordedChunks = [];
      };

      state.mediaRecorder.start(200);
      state.isRecording = true;
      shutter.classList.add('recording');
      recTimerEl.classList.add('recording');
      recTimerEl.style.display = 'block';
      startRecTimer();
    }

    function stopRecording() {
      if (!state.isRecording || !state.mediaRecorder) return;
      state.mediaRecorder.stop();
      state.isRecording = false;
      shutter.classList.remove('recording');
      recTimerEl.classList.remove('recording');
      recTimerEl.style.display = 'none';
      stopRecTimer();
    }

    let recInterval = null;
    let recSeconds = 0;

    function startRecTimer() {
      recSeconds = 0;
      recTimerEl.textContent = '00:00:00';
      recInterval = setInterval(() => {
        recSeconds++;
        const h = String(Math.floor(recSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((recSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(recSeconds % 60).padStart(2, '0');
        recTimerEl.textContent = `${h}:${m}:${s}`;
      }, 1000);
    }

    function stopRecTimer() {
      clearInterval(recInterval);
      recInterval = null;
    }

    // ===================== Mode Switch =====================
    function setMode(mode) {
      if (state.isRecording) {
        showToast('Hãy dừng quay video trước');
        return;
      }
      state.mode = mode;

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      // Update shutter appearance
      if (mode === 'video') {
        shutter.classList.add('video-mode');
      } else {
        shutter.classList.remove('video-mode');
      }

      // QR hint
      qrHint.style.display = mode === 'qr' ? 'block' : 'none';

      // Restart camera if needed (audio for video)
      if (mode === 'video') {
        startCamera();
      }
    }

    // ===================== Event Listeners =====================
    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // Shutter
    shutter.addEventListener('click', () => {
      if (state.mode === 'video') {
        if (state.isRecording) {
          stopRecording();
        } else {
          startRecording();
        }
      } else {
        capturePhoto();
      }
    });

    // Flash
    flashBtn.addEventListener('click', () => {
      state.flashOn = !state.flashOn;
      flashBtn.classList.toggle('active', state.flashOn);
      updateFlashOverlay();
      if (state.flashOn) {
        showToast('Hãy bật độ sáng tối đa để có hiệu quả tốt nhất');
      }
    });

    // Color picker
    colorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      colorPalette.classList.toggle('show');
      timerMenu.classList.remove('show');
    });

    document.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        state.flashColor = sw.dataset.color;
        colorDot.style.background = state.flashColor;
        updateFlashOverlay();
        colorPalette.classList.remove('show');
      });
    });

    // Timer
    timerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      timerMenu.classList.toggle('show');
      colorPalette.classList.remove('show');
    });

    document.querySelectorAll('.timer-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.timer-opt').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        state.timerSec = parseInt(opt.dataset.sec, 10);
        timerBtn.classList.toggle('active', state.timerSec > 0);
        timerMenu.classList.remove('show');
        if (state.timerSec > 0) {
          showToast(`Hẹn giờ ${state.timerSec} giây`);
        }
      });
    });

    // Flip
    document.getElementById('flip-v').addEventListener('click', () => {
      state.flipV = !state.flipV;
      applyTransform();
    });

    document.getElementById('flip-h').addEventListener('click', () => {
      state.flipH = !state.flipH;
      applyTransform();
    });

    // QR popup
    document.getElementById('qr-close').addEventListener('click', () => {
      qrPopup.classList.remove('show');
    });

    document.getElementById('qr-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(qrResult.value);
        showToast('Đã sao chép');
      } catch (e) {
        qrResult.select();
        document.execCommand('copy');
        showToast('Đã sao chép');
      }
    });

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
      if (!colorPalette.contains(e.target) && e.target !== colorBtn && !colorBtn.contains(e.target)) {
        colorPalette.classList.remove('show');
      }
      if (!timerMenu.contains(e.target) && e.target !== timerBtn && !timerBtn.contains(e.target)) {
        timerMenu.classList.remove('show');
      }
    });

    // ===================== Init =====================
    // Set default timer active state
    document.querySelector('.timer-opt[data-sec="0"]').classList.add('active');

    // Start camera
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      startCamera();
    } else {
      noCamera.classList.remove('hidden');
      showToast('Trình duyệt không hỗ trợ camera');
    }

    // Handle visibility (pause when tab hidden)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.isRecording) {
        // keep recording
      }
    });
  </script>
</body>
</html>
