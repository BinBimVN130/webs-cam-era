<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    /* ===== Camera Frame 4:3 centered on black ===== */
    #camera-frame {
      position: relative;
      width: min(90vw, calc(90vh * 4 / 3));
      height: min(calc(90vw * 3 / 4), 90vh);
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
    }

    #canvas { display: none; }

    /* Flash overlay trên preview - mờ nhẹ */
    #flash-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
    }
    #flash-overlay.active {
      opacity: 0.22;
    }

    /* No camera - giống ảnh gốc */
    #no-camera {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #c8c8c8;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }
    #no-camera.hidden { display: none; }

    #no-camera .icon-wrap {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    #no-camera h2 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }
    #no-camera p {
      font-size: 14px;
      color: #555;
      max-width: 280px;
      line-height: 1.4;
    }

    /* Countdown */
    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      z-index: 50;
      font-size: clamp(90px, 18vw, 140px);
      font-weight: 200;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    #countdown.show { display: flex; }

    /* Recording timer */
    #rec-timer {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 5px 14px;
      border-radius: 20px;
      z-index: 20;
      display: none;
      font-variant-numeric: tabular-nums;
    }
    #rec-timer.recording { color: #ff3b30; }

    /* QR hint */
    #qr-hint {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 15;
      display: none;
      white-space: nowrap;
    }

    /* Shutter flash nhẹ (chỉ khi KHÔNG bật flash) */
    #shutter-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.06s ease;
    }

    /* Fullscreen flash (CHỈ khi bật flash) */
    #fullscreen-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.35s ease;
    }

    /* ===== Left Controls ===== */
    .left-controls {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
    }

    /* Nhóm màu + flash dính liền */
    .flash-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(28,28,30,0.8);
      backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 5px;
      gap: 2px;
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn.active {
      background: #fff;
      color: #000;
    }
    .ctrl-btn svg { width: 19px; height: 19px; }

    #color-btn .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }

    #timer-btn {
      margin-top: 12px;
      background: rgba(28,28,30,0.8);
      backdrop-filter: blur(14px);
    }
    #timer-btn.active {
      background: #fff;
      color: #000;
    }

    /* Color palette */
    #color-palette {
      position: absolute;
      left: 54px;
      top: 0;
      background: rgba(28,28,30,0.95);
      backdrop-filter: blur(18px);
      border-radius: 14px;
      padding: 11px;
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      z-index: 40;
      box-shadow: 0 10px 36px rgba(0,0,0,0.4);
    }
    #color-palette.show { display: grid; }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .color-swatch:hover,
    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.1);
    }

    /* Timer menu */
    #timer-menu {
      position: absolute;
      left: 54px;
      bottom: 0;
      background: rgba(28,28,30,0.95);
      backdrop-filter: blur(18px);
      border-radius: 12px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 40;
      min-width: 74px;
    }
    #timer-menu.show { display: flex; }

    .timer-opt {
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 14px;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
    }
    .timer-opt:hover,
    .timer-opt.active {
      background: rgba(255,255,255,0.14);
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: rgba(28,28,30,0.92);
      color: #fff;
      padding: 10px 16px;
      border-radius: 11px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      max-width: 88%;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Right Controls ===== */
    .right-controls {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 30;
    }

    .mode-switcher {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(28,28,30,0.8);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 5px;
    }

    .mode-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: #fff;
      color: #000;
    }
    .mode-btn svg { width: 18px; height: 18px; }

    /* Shutter */
    #shutter {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3.5px solid #fff;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s;
      margin: 2px 0;
    }
    #shutter:active { transform: scale(0.9); }

    #shutter.video-mode {
      background: transparent;
    }
    #shutter.video-mode::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #ff3b30;
      transition: all 0.2s ease;
    }
    #shutter.recording {
      border-color: #ff3b30;
    }
    #shutter.recording::after {
      inset: 15px;
      border-radius: 5px;
      background: #ff3b30;
    }

    .flip-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(28,28,30,0.8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
    }
    .flip-btn svg { width: 16px; height: 16px; }

    /* QR Popup */
    #qr-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 20px;
    }
    #qr-popup.show { display: flex; }

    .qr-box {
      background: #1c1c1e;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .qr-box h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .qr-box textarea {
      width: 100%;
      min-height: 110px;
      background: #2c2c2e;
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      margin-bottom: 14px;
      font-family: inherit;
      line-height: 1.45;
    }
    .qr-actions {
      display: flex;
      gap: 10px;
    }
    .qr-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .qr-actions .copy-btn {
      background: #0a84ff;
      color: #fff;
    }
    .qr-actions .close-btn {
      background: #3a3a3c;
      color: #fff;
    }

    @media (max-width: 500px) {
      .left-controls { left: 6px; }
      .right-controls { right: 6px; }
      #shutter { width: 58px; height: 58px; }
      #camera-frame {
        width: min(96vw, calc(88vh * 4 / 3));
        height: min(calc(96vw * 3 / 4), 88vh);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Camera frame 4:3 -->
    <div id="camera-frame">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="flash-overlay"></div>
      <div id="shutter-flash"></div>

      <div id="no-camera">
        <svg class="icon-wrap" viewBox="0 0 24 24" fill="none">
          <path d="M23 7l-7 5 7 5V7z" stroke="#555" stroke-width="1.5" fill="none"/>
          <rect x="1" y="5" width="15" height="14" rx="2" stroke="#555" stroke-width="1.5" fill="none"/>
          <path d="M2 2l20 20" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2>Không có camera</h2>
        <p>Kiểm tra lại quyền của trình duyệt, cáp camera,...</p>
      </div>

      <div id="countdown"></div>
      <div id="rec-timer">00:00:00</div>
      <div id="qr-hint">Đưa QR vào khung hình và chụp ảnh</div>
    </div>

    <!-- Left controls -->
    <div class="left-controls">
      <div class="flash-group">
        <button class="ctrl-btn" id="color-btn" title="Chọn màu đèn">
          <div class="dot" id="color-dot"></div>
        </button>
        <button class="ctrl-btn" id="flash-btn" title="Đèn flash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </button>
      </div>

      <button class="ctrl-btn" id="timer-btn" title="Hẹn giờ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
      </button>
    </div>

    <!-- Color palette -->
    <div id="color-palette">
      <div class="color-swatch selected" data-color="#ffffff" style="background:#ffffff"></div>
      <div class="color-swatch" data-color="#ffcc00" style="background:#ffcc00"></div>
      <div class="color-swatch" data-color="#ff9500" style="background:#ff9500"></div>
      <div class="color-swatch" data-color="#007aff" style="background:#007aff"></div>
      <div class="color-swatch" data-color="#ff3b30" style="background:#ff3b30"></div>
      <div class="color-swatch" data-color="#af52de" style="background:#af52de"></div>
      <div class="color-swatch" data-color="#34c759" style="background:#34c759"></div>
      <div class="color-swatch" data-color="#ff2d55" style="background:#ff2d55"></div>
    </div>

    <!-- Timer menu -->
    <div id="timer-menu">
      <button class="timer-opt active" data-sec="0">Tắt</button>
      <button class="timer-opt" data-sec="3">3s</button>
      <button class="timer-opt" data-sec="5">5s</button>
      <button class="timer-opt" data-sec="10">10s</button>
      <button class="timer-opt" data-sec="15">15s</button>
    </div>

    <!-- Right controls -->
    <div class="right-controls">
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="photo" title="Chụp ảnh">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
        </button>
        <button class="mode-btn" data-mode="video" title="Quay video">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </button>
        <button class="mode-btn" data-mode="qr" title="Quét QR">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h2v2h-2zM15 15h2v2h-2zM13 17h2v2h-2zM15 19h2v2h-2zM17 13h2v2h-2zM19 15h2v2h-2zM17 17h2v2h-2zM19 19h2v2h-2z"/>
          </svg>
        </button>
      </div>

      <button id="shutter" title="Chụp / Quay"></button>

      <button class="flip-btn" id="flip-v" title="Lật đứng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>
        </svg>
      </button>
      <button class="flip-btn" id="flip-h" title="Lật ngang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>
        </svg>
      </button>
    </div>

    <!-- QR Popup -->
    <div id="qr-popup">
      <div class="qr-box">
        <h3>Kết quả quét QR</h3>
        <textarea id="qr-result" readonly></textarea>
        <div class="qr-actions">
          <button class="copy-btn" id="qr-copy">Sao chép</button>
          <button class="close-btn" id="qr-close">Đóng</button>
        </div>
      </div>
    </div>

    <div id="fullscreen-flash"></div>
    <div id="toast"></div>
  </div>

  <script>
    const state = {
      stream: null,
      mode: 'photo',
      isRecording: false,
      mediaRecorder: null,
      recordedChunks: [],
      flipH: false,
      flipV: false,
      flashOn: false,
      flashColor: '#ffffff',
      timerSec: 0,
      isCounting: false,
      facingMode: 'user'
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const noCamera = document.getElementById('no-camera');
    const flashOverlay = document.getElementById('flash-overlay');
    const countdownEl = document.getElementById('countdown');
    const recTimerEl = document.getElementById('rec-timer');
    const qrHint = document.getElementById('qr-hint');
    const shutter = document.getElementById('shutter');
    const flashBtn = document.getElementById('flash-btn');
    const colorBtn = document.getElementById('color-btn');
    const colorDot = document.getElementById('color-dot');
    const colorPalette = document.getElementById('color-palette');
    const timerBtn = document.getElementById('timer-btn');
    const timerMenu = document.getElementById('timer-menu');
    const qrPopup = document.getElementById('qr-popup');
    const qrResult = document.getElementById('qr-result');
    const toast = document.getElementById('toast');
    const shutterFlash = document.getElementById('shutter-flash');
    const fullscreenFlash = document.getElementById('fullscreen-flash');

    function showToast(msg, duration = 2500) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function playBeep(freq = 880, duration = 0.1) {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.22, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + duration);
        osc.start(ac.currentTime);
        osc.stop(ac.currentTime + duration);
      } catch (e) {}
    }

    function playShutterSound() {
      playBeep(1400, 0.05);
      setTimeout(() => playBeep(1000, 0.04), 45);
    }

    function applyTransform() {
      video.style.transform = `scale(${state.flipH ? -1 : 1}, ${state.flipV ? -1 : 1})`;
    }

    function updateFlashOverlay() {
      if (state.flashOn) {
        flashOverlay.style.background = state.flashColor;
        flashOverlay.classList.add('active');
      } else {
        flashOverlay.classList.remove('active');
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
    }

    async function startCamera() {
      try {
        if (state.stream) {
          state.stream.getTracks().forEach(t => t.stop());
        }

        const constraints = {
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 30 }
          },
          audio: state.mode === 'video'
        };

        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.stream;
        video.muted = true;
        await video.play();
        noCamera.classList.add('hidden');
      } catch (err) {
        console.error(err);
        noCamera.classList.remove('hidden');
        showToast('Không thể truy cập camera. Hãy kiểm tra quyền trình duyệt.');
      }
    }

    async function capturePhoto() {
      if (!state.stream || state.isCounting || !video.videoWidth) return;

      // Timer
      if (state.timerSec > 0) {
        state.isCounting = true;
        countdownEl.classList.add('show');
        for (let i = state.timerSec; i > 0; i--) {
          countdownEl.textContent = i;
          playBeep(950, 0.08);
          await new Promise(r => setTimeout(r, 1000));
        }
        countdownEl.classList.remove('show');
        state.isCounting = false;
      }

      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;

      // Fullscreen flash CHỈ khi bật flash
      if (state.flashOn) {
        fullscreenFlash.style.background = state.flashColor;
        fullscreenFlash.style.opacity = '1';
        await new Promise(r => requestAnimationFrame(() => setTimeout(r, 100)));
      }

      // Vẽ frame
      ctx.save();
      if (state.flipH || state.flipV) {
        ctx.translate(w / 2, h / 2);
        ctx.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1);
        ctx.translate(-w / 2, -h / 2);
      }
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();

      // Hiệu ứng shutter nhẹ khi KHÔNG bật flash
      if (!state.flashOn) {
        shutterFlash.style.opacity = '0.7';
        playShutterSound();
        setTimeout(() => { shutterFlash.style.opacity = '0'; }, 60);
      } else {
        playShutterSound();
        setTimeout(() => { fullscreenFlash.style.opacity = '0'; }, 70);
      }

      // QR
      if (state.mode === 'qr') {
        try {
          const imageData = ctx.getImageData(0, 0, w, h);
          const code = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) {
            qrResult.value = code.data;
            qrPopup.classList.add('show');
          } else {
            showToast('Không tìm thấy mã QR. Hãy đưa QR vào giữa khung hình.');
          }
        } catch (e) {
          showToast('Lỗi khi quét QR');
        }
        return;
      }

      // Lưu PNG
      canvas.toBlob(blob => {
        if (blob) {
          downloadBlob(blob, `photo_${Date.now()}.png`);
          showToast('Đã lưu ảnh');
        }
      }, 'image/png', 0.92);
    }

    function startRecording() {
      if (!state.stream || state.isRecording) return;

      state.recordedChunks = [];
      let mime = 'video/webm;codecs=vp8,opus';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      try {
        state.mediaRecorder = new MediaRecorder(state.stream, {
          mimeType: mime,
          videoBitsPerSecond: 2000000
        });
      } catch (e) {
        showToast('Trình duyệt không hỗ trợ quay video');
        return;
      }

      state.mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) state.recordedChunks.push(e.data);
      };
      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
        downloadBlob(blob, `video_${Date.now()}.webm`);
        showToast('Đã lưu video');
        state.recordedChunks = [];
      };

      state.mediaRecorder.start(200);
      state.isRecording = true;
      shutter.classList.add('recording');
      recTimerEl.classList.add('recording');
      recTimerEl.style.display = 'block';
      startRecTimer();
    }

    function stopRecording() {
      if (!state.isRecording || !state.mediaRecorder) return;
      state.mediaRecorder.stop();
      state.isRecording = false;
      shutter.classList.remove('recording');
      recTimerEl.classList.remove('recording');
      recTimerEl.style.display = 'none';
      stopRecTimer();
    }

    let recInterval = null, recSeconds = 0;
    function startRecTimer() {
      recSeconds = 0;
      recTimerEl.textContent = '00:00:00';
      recInterval = setInterval(() => {
        recSeconds++;
        const h = String(Math.floor(recSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((recSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(recSeconds % 60).padStart(2, '0');
        recTimerEl.textContent = `${h}:${m}:${s}`;
      }, 1000);
    }
    function stopRecTimer() {
      clearInterval(recInterval);
      recInterval = null;
    }

    function setMode(mode) {
      if (state.isRecording) {
        showToast('Hãy dừng quay video trước');
        return;
      }
      state.mode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      if (mode === 'video') {
        shutter.classList.add('video-mode');
        startCamera();
      } else {
        shutter.classList.remove('video-mode');
      }
      qrHint.style.display = mode === 'qr' ? 'block' : 'none';
    }

    // Events
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    shutter.addEventListener('click', () => {
      if (state.mode === 'video') {
        state.isRecording ? stopRecording() : startRecording();
      } else {
        capturePhoto();
      }
    });

    flashBtn.addEventListener('click', () => {
      state.flashOn = !state.flashOn;
      flashBtn.classList.toggle('active', state.flashOn);
      updateFlashOverlay();
      if (state.flashOn) showToast('Hãy bật độ sáng tối đa để có hiệu quả tốt nhất');
    });

    colorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      colorPalette.classList.toggle('show');
      timerMenu.classList.remove('show');
    });

    document.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        state.flashColor = sw.dataset.color;
        colorDot.style.background = state.flashColor;
        updateFlashOverlay();
        colorPalette.classList.remove('show');
      });
    });

    timerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      timerMenu.classList.toggle('show');
      colorPalette.classList.remove('show');
    });

    document.querySelectorAll('.timer-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.timer-opt').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        state.timerSec = parseInt(opt.dataset.sec, 10);
        timerBtn.classList.toggle('active', state.timerSec > 0);
        timerMenu.classList.remove('show');
        if (state.timerSec > 0) showToast(`Hẹn giờ ${state.timerSec} giây`);
      });
    });

    document.getElementById('flip-v').addEventListener('click', () => {
      state.flipV = !state.flipV;
      applyTransform();
    });
    document.getElementById('flip-h').addEventListener('click', () => {
      state.flipH = !state.flipH;
      applyTransform();
    });

    document.getElementById('qr-close').addEventListener('click', () => qrPopup.classList.remove('show'));
    document.getElementById('qr-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(qrResult.value);
        showToast('Đã sao chép');
      } catch {
        qrResult.select();
        document.execCommand('copy');
        showToast('Đã sao chép');
      }
    });

    document.addEventListener('click', (e) => {
      if (!colorPalette.contains(e.target) && e.target !== colorBtn && !colorBtn.contains(e.target)) {
        colorPalette.classList.remove('show');
      }
      if (!timerMenu.contains(e.target) && e.target !== timerBtn && !timerBtn.contains(e.target)) {
        timerMenu.classList.remove('show');
      }
    });

    // Init
    if (navigator.mediaDevices?.getUserMedia) {
      startCamera();
    } else {
      noCamera.classList.remove('hidden');
      showToast('Trình duyệt không hỗ trợ camera');
    }
  </script>
</body>
</html>
