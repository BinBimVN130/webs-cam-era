<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
    #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;background:#000;transition:background-color .3s}

    #fps{
      position:fixed;top:10px;left:12px;z-index:40;
      font-size:11px;font-weight:400;color:rgba(255,255,255,.45);
      letter-spacing:.2px;pointer-events:none;
      font-family:inherit;
    }
    #fps .ver{opacity:.7;font-weight:400}

    #stage{
      position:relative;
      width:min(calc(100vw - 160px), calc(88vh * 16 / 9));
      height:min(calc((100vw - 160px) * 9 / 16), 88vh);
      background:#000;border-radius:12px;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      transition:background-color .3s;
    }
    #camera-frame{
      position:relative;background:#111;overflow:hidden;border-radius:10px;
      width:100%;height:100%;
      transition:width .25s ease,height .25s ease,opacity .22s ease,transform .25s ease;
    }
    #camera-frame.mode-switching{
      opacity:.5;
      transform:scale(0.98);
    }
    #video-wrap{width:100%;height:100%;overflow:hidden;position:relative}
    #video{
      width:100%;height:100%;object-fit:cover;display:block;background:#000;
      transform-origin:center center;will-change:transform;
    }
    #canvas,#rec-canvas{display:none}

    #no-camera{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#8a8a8a;z-index:10;
    }
    #no-camera.hidden{display:none}
    #no-camera svg{width:72px;height:72px;opacity:.7}

    #countdown{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.45);z-index:50;font-size:clamp(90px,18vw,140px);font-weight:200;color:#fff;
    }
    #countdown.show{display:flex}

    #rec-timer{
      position:absolute;top:12px;left:50%;transform:translateX(-50%);
      font-size:16px;font-weight:500;color:#fff;background:rgba(0,0,0,.55);
      padding:5px 14px;border-radius:20px;z-index:20;display:none;font-variant-numeric:tabular-nums;
    }
    #rec-timer.recording{color:#ff3b30}

    #qr-hint{
      position:absolute;top:12px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.65);color:#fff;padding:8px 18px;border-radius:20px;
      font-size:13px;z-index:15;display:none;white-space:nowrap;
    }
    #zoom-label{
      position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
      font-size:15px;font-weight:600;color:rgba(255,255,255,.55);
      z-index:35;pointer-events:none;letter-spacing:.4px;
      display:none;text-shadow:0 1px 4px rgba(0,0,0,.5);
      transition:opacity .2s ease;
    }

    #shutter-flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .05s}
    #fullscreen-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .4s}

    /* Zoom - cố định vị trí theo stage, không theo frame */
    .zoom-control{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      display:flex;flex-direction:column;align-items:center;gap:8px;
      height:150px;z-index:25;pointer-events:auto;
    }
    .zoom-control svg{width:16px;height:16px;opacity:.85;fill:#fff}
    .zoom-slider{
      writing-mode:vertical-lr;direction:rtl;
      width:5px;height:120px;-webkit-appearance:none;appearance:none;
      background:rgba(255,255,255,.28);border-radius:3px;outline:none;
    }
    .zoom-slider::-webkit-slider-thumb{
      -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
      background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);
    }

    /* ===== Left controls ===== */
    .left-controls{
      position:absolute;left:12px;top:50%;transform:translateY(-50%);
      display:flex;flex-direction:column;align-items:center;z-index:30;gap:10px;
    }
    .left-divider{
      width:20px;height:1px;background:rgba(255,255,255,.22);margin:2px 0;border:none;flex-shrink:0;
    }
    #reset-btn{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:calc(100% + 14px);
      z-index:30;
      /* neo theo cột left-controls → luôn thẳng hàng */
    }
    .flash-group{
      display:flex;flex-direction:column;align-items:center;
      background:rgba(40,40,42,.92);border-radius:26px;padding:5px;gap:2px;position:relative;
    }
    .ctrl-btn{
      width:40px;height:40px;border-radius:50%;border:none;
      background:rgba(40,40,42,.92);color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:transform .12s,background .15s,color .15s;position:relative;
    }
    .ctrl-btn:active{transform:scale(.9)}
    .ctrl-btn.active{background:#fff;color:#000}
    .ctrl-btn svg{width:18px;height:18px}
    .ctrl-btn.is-modified{background:#fff;color:#000}

    .flash-group .ctrl-btn{background:transparent}
    .flash-group .ctrl-btn.active{background:#fff;color:#000}

    #color-btn .dot{
      width:18px;height:18px;border-radius:50%;background:#fff;
      border:1.5px solid rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(0,0,0,.2);
    }
    #aspect-btn{
      width:40px;height:40px;border-radius:50%;
      font-size:11px;font-weight:800;letter-spacing:-.3px;
      background:rgba(40,40,42,.92);
    }

    /* Popup menus chung (màu / timer / EV / sat / temp) */
    .popup-menu{
      display:none;position:fixed;z-index:60;
      background:rgba(28,28,30,.95);border-radius:14px;padding:8px 12px;
      box-shadow:0 8px 28px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
      backdrop-filter:none;
    }
    .popup-menu.show{display:block}

    #color-palette{
      display:none;position:fixed;z-index:60;
      background:rgba(28,28,30,.95);border-radius:14px;padding:10px;
      grid-template-columns:repeat(2,1fr);gap:8px;
      box-shadow:0 8px 28px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
    }
    #color-palette.show{display:grid}
    .color-swatch{
      width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;
      transition:transform .12s,border-color .12s;
    }
    .color-swatch:hover,.color-swatch.selected{border-color:#fff;transform:scale(1.1)}

    #timer-menu{
      display:none;position:fixed;z-index:60;
      background:rgba(28,28,30,.95);border-radius:12px;padding:6px;
      flex-direction:column;gap:2px;min-width:72px;
      box-shadow:0 8px 28px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
    }
    #timer-menu.show{display:flex}
    .timer-opt{
      padding:9px 14px;border:none;background:transparent;color:#fff;
      font-size:14px;border-radius:8px;cursor:pointer;text-align:center;white-space:nowrap;
    }
    .timer-opt:hover,.timer-opt.active{background:rgba(255,255,255,.14)}

    /* EV / Sat / Temp popup */
    .adj-popup{
      display:none;position:fixed;z-index:60;
      background:rgba(30,30,32,.96);border-radius:22px;padding:12px 16px 14px;
      box-shadow:0 8px 28px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);
      flex-direction:column;gap:10px;min-width:200px;
    }
    .adj-popup.show{display:flex}
    .adj-popup .row-top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .adj-popup .label{
      font-size:13px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap;
      flex:1;text-align:center;
    }
    .adj-popup .icon-l,.adj-popup .icon-r{
      width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      font-size:15px;line-height:1;
    }
    .adj-popup input[type=range]{
      width:100%;-webkit-appearance:none;appearance:none;height:3px;
      background:rgba(255,255,255,.22);border-radius:2px;outline:none;margin:0;
    }
    .adj-popup input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
      background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);
    }

    #toast{
      position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);
      background:rgba(40,40,42,.95);color:#fff;padding:10px 16px;border-radius:11px;
      font-size:14px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:88%;text-align:center;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Right */
    .right-controls{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      display:flex;flex-direction:column;align-items:center;gap:12px;z-index:30;
    }
    .mode-switcher{
      display:flex;flex-direction:column;gap:5px;
      background:rgba(40,40,42,.92);border-radius:24px;padding:5px;
    }
    .mode-btn{
      width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:#aaa;
      display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
    }
    .mode-btn.active{background:#fff;color:#000}
    .mode-btn svg{width:18px;height:18px}

    #shutter{
      width:64px;height:64px;border-radius:50%;
      border:3.5px solid #fff;background:transparent;
      cursor:pointer;position:relative;
      transition:transform .1s,border-color .2s;margin:2px 0;
    }
    #shutter::after{
      content:"";position:absolute;inset:5px;border-radius:50%;
      background:#fff;transition:background .2s,border-radius .2s;
    }
    #shutter:active{transform:scale(.9)}
    #shutter.video-mode{border-color:#fff}
    #shutter.video-mode::after{inset:8px;border-radius:50%;background:#ff3b30}
    #shutter.recording{border-color:#ff3b30}
    #shutter.recording::after{inset:16px;border-radius:5px;background:#ff3b30}
    #shutter.dark-mode{border-color:#1c1c1e}
    #shutter.dark-mode::after{background:#1c1c1e}
    #shutter.hidden-mode{visibility:hidden;pointer-events:none}

    /* Khi đang quay: ẩn hết trừ nút dừng */
    .recording-active .left-controls,
    .recording-active #reset-btn,
    .recording-active .zoom-control,
    .recording-active .mode-switcher,
    .recording-active .flip-btn,
    .recording-active #fps,
    .recording-active #zoom-label,
    .recording-active #qr-hint,
    .recording-active #color-palette,
    .recording-active #timer-menu,
    .recording-active .adj-popup {
      visibility:hidden !important;pointer-events:none !important;
    }

    /* Mic level meter - đáy màn hình */
    #mic-meter{
      display:none;position:fixed;left:18px;bottom:16px;z-index:36;
      align-items:center;gap:8px;pointer-events:none;
      opacity:0;transform:translateY(8px);
      transition:opacity .25s ease, transform .25s ease;
    }
    #mic-meter.show{display:flex;opacity:1;transform:translateY(0)}
    #mic-meter svg{width:14px;height:14px;flex-shrink:0;opacity:.85}
    #mic-meter .bar-bg{
      width:72px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);
      overflow:hidden;
    }
    #mic-meter .bar-fill{
      height:100%;width:0%;border-radius:3px;
      background:#34c759;transition:width .05s linear, background .1s;
    }
    .recording-active #shutter{visibility:visible !important;pointer-events:auto !important}
    .recording-active #mic-meter{display:flex !important;visibility:visible !important}

    .flip-btn{
      width:36px;height:36px;border-radius:50%;border:none;
      background:rgba(40,40,42,.92);color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .flip-btn svg{width:16px;height:16px}
    .flip-btn.active{background:#0a84ff;color:#fff}

    #qr-popup{
      position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
      align-items:center;justify-content:center;z-index:250;padding:20px;
    }
    #qr-popup.show{display:flex}
    .qr-box{background:#1c1c1e;border-radius:16px;width:100%;max-width:360px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .qr-box h3{font-size:17px;font-weight:600;margin-bottom:12px}
    .qr-box textarea{
      width:100%;min-height:110px;background:#2c2c2e;border:none;border-radius:10px;color:#fff;
      padding:12px;font-size:14px;resize:none;outline:none;margin-bottom:14px;font-family:inherit;line-height:1.45;
    }
    .qr-actions{display:flex;gap:10px}
    .qr-actions button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}
    .qr-actions .copy-btn{background:#0a84ff;color:#fff}
    .qr-actions .close-btn{background:#3a3a3c;color:#fff}

    @media(max-width:600px){
      #stage{width:min(calc(100vw - 130px),calc(86vh * 16 / 9));height:min(calc((100vw - 130px)*9/16),86vh)}
      .left-controls{left:6px}.right-controls{right:6px}
      #reset-btn{/* kế thừa left-controls */}
      #shutter{width:56px;height:56px}
      .zoom-control{right:10px;height:130px}
      .zoom-slider{height:100px}
    }
  </style>
</head>
<body>
<div id="app">
  <div id="fps">FPS: -- <span class="ver">| v1.0.0</span></div>

  <div id="stage">
    <div id="camera-frame">
      <div id="video-wrap">
        <video id="video" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>
      <canvas id="rec-canvas"></canvas>
      <div id="shutter-flash"></div>
      <div id="no-camera">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M23 7l-7 5 7 5V7z" stroke="#fff" stroke-width="1.4"/>
          <rect x="1" y="5" width="15" height="14" rx="2" stroke="#fff" stroke-width="1.4"/>
          <path d="M2 2l20 20" stroke="#e8a0a0" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="countdown"></div>
      <div id="rec-timer">00:00:00</div>
      <div id="qr-hint">Đưa QR vào khung hình để bắt đầu quét</div>
    </div>

    <!-- Zoom cố định theo stage -->
    <div class="zoom-control" id="zoom-control">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="range" class="zoom-slider" id="zoom-slider" min="1" max="10" step="0.1" value="1">
    </div>
  </div>

  <!-- Left -->
  <div class="left-controls">
    <div class="flash-group">
      <button class="ctrl-btn" id="color-btn" title="Màu flash"><div class="dot" id="color-dot"></div></button>
      <button class="ctrl-btn" id="flash-btn" title="Flash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </button>
    </div>

    <button class="ctrl-btn" id="timer-btn" title="Hẹn giờ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>

    <button class="ctrl-btn" id="aspect-btn" title="Tỷ lệ">16:9</button>

    <div class="left-divider"></div>

    <button class="ctrl-btn" id="ev-btn" title="EV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="sat-btn" title="Độ bão hòa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" opacity=".35"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="temp-btn" title="Nhiệt độ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="reset-btn" title="Reset" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
  </div>

  <!-- Popups -->
  <div id="color-palette">
    <div class="color-swatch selected" data-color="#ffffff" style="background:#fff"></div>
    <div class="color-swatch" data-color="#ffcc00" style="background:#ffcc00"></div>
    <div class="color-swatch" data-color="#ff9500" style="background:#ff9500"></div>
    <div class="color-swatch" data-color="#007aff" style="background:#007aff"></div>
    <div class="color-swatch" data-color="#ff3b30" style="background:#ff3b30"></div>
    <div class="color-swatch" data-color="#af52de" style="background:#af52de"></div>
    <div class="color-swatch" data-color="#34c759" style="background:#34c759"></div>
    <div class="color-swatch" data-color="#ff2d55" style="background:#ff2d55"></div>
  </div>

  <div id="timer-menu">
    <button class="timer-opt active" data-sec="0">Tắt</button>
    <button class="timer-opt" data-sec="3">3s</button>
    <button class="timer-opt" data-sec="5">5s</button>
    <button class="timer-opt" data-sec="10">10s</button>
  </div>

  <div class="adj-popup" id="ev-popup">
    <div class="row-top">
      <span class="icon-l">☀</span>
      <span class="label">EV</span>
      <span class="icon-r">☾</span>
    </div>
    <input type="range" id="ev-slider" min="-2" max="2" step="0.05" value="0">
  </div>

  <div class="adj-popup" id="sat-popup">
    <div class="row-top">
      <span class="icon-l" style="opacity:.5">○</span>
      <span class="label">Độ bão hòa</span>
      <span class="icon-r">●</span>
    </div>
    <input type="range" id="sat-slider" min="0" max="2" step="0.05" value="1">
  </div>

  <div class="adj-popup" id="temp-popup">
    <div class="row-top">
      <span class="icon-l" style="color:#5ac8fa">●</span>
      <span class="label">Nhiệt độ</span>
      <span class="icon-r" style="color:#ff9500">●</span>
    </div>
    <input type="range" id="temp-slider" min="-1" max="1" step="0.05" value="0">
  </div>

  <!-- Right -->
  <div class="right-controls">
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="photo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </button>
      <button class="mode-btn" data-mode="video">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      <button class="mode-btn" data-mode="qr">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h2v2h-2zM15 15h2v2h-2zM13 17h2v2h-2zM15 19h2v2h-2zM17 13h2v2h-2zM19 15h2v2h-2zM17 17h2v2h-2zM19 19h2v2h-2z"/></svg>
      </button>
    </div>
    <button id="shutter"></button>
    <button class="flip-btn" id="flip-v" title="Lật đứng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>
    </button>
    <button class="flip-btn" id="flip-h" title="Lật ngang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
    </button>
  </div>

  <div id="qr-popup">
    <div class="qr-box">
      <h3>Kết quả quét QR</h3>
      <textarea id="qr-result" readonly></textarea>
      <div class="qr-actions">
        <button class="copy-btn" id="qr-copy">Sao chép</button>
        <button class="close-btn" id="qr-close">Đóng</button>
      </div>
    </div>
  </div>
  <div id="fullscreen-flash"></div>
  <div id="mic-meter">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
      </svg>
      <div class="bar-bg"><div class="bar-fill" id="mic-bar"></div></div>
    </div>
  <div id="zoom-label">1x</div>
  <div id="toast"></div>
</div>

<script>
const state = {
  stream:null, mode:'photo', isRecording:false, mediaRecorder:null, recordedChunks:[],
  flipH:false, flipV:false, flashOn:false, flashColor:'#ffffff',
  timerSec:0, isCounting:false, facingMode:'user', forceAspect:'16:9',
  recAnimId:null, qrScanning:false, qrAnimId:null,
  zoom:1, panX:0, panY:0, isPanning:false,
  panStartX:0, panStartY:0, panOriginX:0, panOriginY:0,
  ev:0, sat:1, temp:0,
  frameCount:0, lastFpsTime:performance.now()
};

const app=document.getElementById('app');
const stage=document.getElementById('stage');
const cameraFrame=document.getElementById('camera-frame');
const videoWrap=document.getElementById('video-wrap');
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const recCanvas=document.getElementById('rec-canvas');
const recCtx=recCanvas.getContext('2d');
const noCamera=document.getElementById('no-camera');
const countdownEl=document.getElementById('countdown');
const recTimerEl=document.getElementById('rec-timer');
const qrHint=document.getElementById('qr-hint');
const shutter=document.getElementById('shutter');
const flashBtn=document.getElementById('flash-btn');
const colorBtn=document.getElementById('color-btn');
const colorDot=document.getElementById('color-dot');
const colorPalette=document.getElementById('color-palette');
const timerBtn=document.getElementById('timer-btn');
const timerMenu=document.getElementById('timer-menu');
const aspectBtn=document.getElementById('aspect-btn');
const evBtn=document.getElementById('ev-btn');
const satBtn=document.getElementById('sat-btn');
const tempBtn=document.getElementById('temp-btn');
const evPopup=document.getElementById('ev-popup');
const satPopup=document.getElementById('sat-popup');
const tempPopup=document.getElementById('temp-popup');
const evSlider=document.getElementById('ev-slider');
const satSlider=document.getElementById('sat-slider');
const tempSlider=document.getElementById('temp-slider');
const zoomSlider=document.getElementById('zoom-slider');
const fpsEl=document.getElementById('fps');
const qrPopup=document.getElementById('qr-popup');
const qrResult=document.getElementById('qr-result');
const toast=document.getElementById('toast');
const shutterFlash=document.getElementById('shutter-flash');
const fullscreenFlash=document.getElementById('fullscreen-flash');
const flipVBtn=document.getElementById('flip-v');
const flipHBtn=document.getElementById('flip-h');

function showToast(msg,ms=2500){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),ms);
}
function playBeep(f=880,d=.1){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function playShutterSound(){playBeep(1400,.05);setTimeout(()=>playBeep(1000,.04),45)}

function closeAllMenus(){
  colorPalette.classList.remove('show');
  timerMenu.classList.remove('show');
  evPopup.classList.remove('show');
  satPopup.classList.remove('show');
  tempPopup.classList.remove('show');
}

function placePopup(el, btn){
  const r=btn.getBoundingClientRect();
  el.style.left=(r.right+10)+'px';
  el.style.top=(r.top+r.height/2)+'px';
  el.style.transform='translateY(-50%)';
}

function applyFilters(){
  const br = 1 + state.ev * 0.75;
  const sat = state.sat;
  let filter = `brightness(${br}) saturate(${sat})`;
  if(state.temp > 0.02){
    // Ấm: vàng/cam (sepia)
    const t = state.temp;
    filter += ` sepia(${t*0.5}) saturate(${1+t*0.35}) hue-rotate(${-t*8}deg)`;
  }else if(state.temp < -0.02){
    // Lạnh: xanh/cyan — KHÔNG dùng hue-rotate âm (gây tím trên da)
    const t = -state.temp; // 0..1
    filter += ` sepia(${t*0.35}) hue-rotate(${175+t*25}deg) saturate(${1+t*0.25}) brightness(${1+t*0.03})`;
  }
  video.style.filter = filter;
  const evMod = Math.abs(state.ev) > 0.02;
  const satMod = Math.abs(state.sat - 1) > 0.02;
  const tempMod = Math.abs(state.temp) > 0.02;
  evBtn.classList.toggle('is-modified', evMod);
  satBtn.classList.toggle('is-modified', satMod);
  tempBtn.classList.toggle('is-modified', tempMod);
  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn) resetBtn.style.display = (evMod || satMod || tempMod) ? 'flex' : 'none';
}

function applyVideoTransform(){
  const sx=state.flipH?-state.zoom:state.zoom;
  const sy=state.flipV?-state.zoom:state.zoom;
  video.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${sx},${sy})`;
  flipVBtn.classList.toggle('active',state.flipV);
  flipHBtn.classList.toggle('active',state.flipH);
}
function clampPan(){
  const max=(state.zoom-1)*180;
  state.panX=Math.max(-max,Math.min(max,state.panX));
  state.panY=Math.max(-max,Math.min(max,state.panY));
}

function updateBackground(){
  const c=state.flashOn?state.flashColor:'#000';
  app.style.background=c;stage.style.background=c;
  updateShutterColor();
}
function isColorLight(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
  return (r*299+g*587+b*114)/1000>160;
}
function updateShutterColor(){
  if(state.mode==='qr'){shutter.classList.add('hidden-mode');return}
  shutter.classList.remove('hidden-mode');
  if(state.flashOn&&isColorLight(state.flashColor)&&state.mode==='photo')
    shutter.classList.add('dark-mode');
  else shutter.classList.remove('dark-mode');
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},150);
}
function adjustAspectRatio(){
  const sw=stage.clientWidth,sh=stage.clientHeight;
  const ratio=state.forceAspect==='4:3'?4/3:16/9;
  const sr=sw/sh;
  let fw,fh;
  if(ratio>sr){fw=sw;fh=sw/ratio}else{fh=sh;fw=sh*ratio}
  cameraFrame.style.width=Math.round(fw)+'px';
  cameraFrame.style.height=Math.round(fh)+'px';
}

async function startCamera(withAudio=false){
  try{
    // Đã có video live và không cần thêm audio → giữ nguyên
    if(state.stream && !withAudio){
      const liveVid = state.stream.getVideoTracks().some(t=>t.readyState==='live');
      if(liveVid){
        noCamera.classList.add('hidden');
        return;
      }
    }
    // Cần audio nhưng đã có video+audio live → giữ
    if(state.stream && withAudio){
      const liveVid = state.stream.getVideoTracks().some(t=>t.readyState==='live');
      const liveAud = state.stream.getAudioTracks().some(t=>t.readyState==='live');
      if(liveVid && liveAud){
        noCamera.classList.add('hidden');
        return;
      }
    }

    // Dừng stream cũ trước khi mở mới
    if(state.stream){
      state.stream.getTracks().forEach(t=>{ try{t.stop()}catch(e){} });
      state.stream=null;
      state._fpsRunning = false; // cho phép đếm lại sau khi mở cam mới
    }

    state.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: state.facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 60, min: 24 }
      },
      audio: !!withAudio
    });
    video.srcObject = state.stream;
    video.muted = true;
    await new Promise(r=>{ if(video.readyState>=2) r(); else video.onloadedmetadata=()=>r(); });
    await video.play();
    noCamera.classList.add('hidden');
    requestAnimationFrame(()=>{ adjustAspectRatio(); setTimeout(adjustAspectRatio, 150); });
    startFpsCounter();
    if(state.mode === 'video') startMicMeter();
  }catch(e){
    console.error(e);
    noCamera.classList.remove('hidden');
    showToast('Không thể truy cập camera.');
  }
}

function startFpsCounter(){
  // Tránh đăng ký nhiều vòng đếm → FPS ảo (70...)
  if(state._fpsRunning) return;
  state._fpsRunning = true;
  state.frameCount = 0;
  state.lastFpsTime = performance.now();
  state._lastMediaTime = -1;

  if(typeof video.requestVideoFrameCallback === 'function'){
    const onFrame = (_now, meta) => {
      if(!state._fpsRunning) return;
      // Chỉ đếm khi mediaTime đổi (frame mới từ camera)
      const mt = meta && typeof meta.mediaTime === 'number' ? meta.mediaTime : null;
      if(mt === null || mt !== state._lastMediaTime){
        if(mt !== null) state._lastMediaTime = mt;
        state.frameCount++;
      }
      const now = performance.now();
      if(now - state.lastFpsTime >= 1000){
        fpsEl.innerHTML = 'FPS: ' + state.frameCount + ' <span class="ver">| v1.0.0</span>';
        state.frameCount = 0;
        state.lastFpsTime = now;
      }
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  } else {
    const updateFromTrack = () => {
      if(!state._fpsRunning) return;
      try{
        const track = state.stream?.getVideoTracks()?.[0];
        const fr = track?.getSettings?.()?.frameRate;
        if(fr) fpsEl.innerHTML = 'FPS: ' + Math.round(fr) + ' <span class="ver">| v1.0.0</span>';
      }catch(e){}
      setTimeout(updateFromTrack, 1000);
    };
    updateFromTrack();
  }
}

function drawToCanvas(targetCtx,tw,th){
  targetCtx.save();
  const cx=tw/2,cy=th/2;
  targetCtx.translate(cx,cy);
  targetCtx.scale(state.flipH?-state.zoom:state.zoom, state.flipV?-state.zoom:state.zoom);
  const scaleX=tw/(cameraFrame.clientWidth||tw);
  const scaleY=th/(cameraFrame.clientHeight||th);
  targetCtx.translate(state.panX*scaleX/state.zoom, state.panY*scaleY/state.zoom);
  targetCtx.translate(-cx,-cy);
  // apply same filters via canvas is hard; for capture we draw raw then note
  targetCtx.filter = video.style.filter || 'none';
  targetCtx.drawImage(video,0,0,tw,th);
  targetCtx.filter = 'none';
  targetCtx.restore();
}

function startQRScan(){
  if(state.qrScanning||!video.videoWidth) return;
  state.qrScanning=true;
  const loop=async()=>{
    if(!state.qrScanning||state.mode!=='qr') return;
    if(video.readyState>=2){
      const w=video.videoWidth,h=video.videoHeight;
      canvas.width=w;canvas.height=h;
      drawToCanvas(ctx,w,h);
      let found=null;
      if('BarcodeDetector' in window){
        try{
          const det=new BarcodeDetector({formats:['qr_code']});
          const bmp=await createImageBitmap(canvas);
          const codes=await det.detect(bmp);bmp.close();
          if(codes?.length&&codes[0].rawValue) found=codes[0].rawValue;
        }catch(e){}
      }
      if(!found){
        const scale=.5;
        const tw=Math.max(200,Math.floor(w*scale)),th=Math.max(200,Math.floor(h*scale));
        const t=document.createElement('canvas');t.width=tw;t.height=th;
        t.getContext('2d').drawImage(canvas,0,0,tw,th);
        const img=t.getContext('2d').getImageData(0,0,tw,th);
        const code=jsQR(img.data,tw,th,{inversionAttempts:'attemptBoth'});
        if(code?.data) found=code.data;
      }
      if(found){
        stopQRScan();
        qrResult.value=found;qrPopup.classList.add('show');playBeep(1200,.15);
        return;
      }
    }
    state.qrAnimId=requestAnimationFrame(loop);
  };
  loop();
}
function stopQRScan(){
  state.qrScanning=false;
  if(state.qrAnimId) cancelAnimationFrame(state.qrAnimId);
  state.qrAnimId=null;
}

async function capturePhoto(){
  if(!state.stream||state.isCounting||!video.videoWidth) return;
  if(state.timerSec>0){
    state.isCounting=true;countdownEl.classList.add('show');
    for(let i=state.timerSec;i>0;i--){
      countdownEl.textContent=i;playBeep(950,.08);
      await new Promise(r=>setTimeout(r,1000));
    }
    countdownEl.classList.remove('show');state.isCounting=false;
  }
  const w=video.videoWidth,h=video.videoHeight;
  canvas.width=w;canvas.height=h;
  if(state.flashOn){
    fullscreenFlash.style.background=state.flashColor;
    fullscreenFlash.style.opacity='1';
    await new Promise(r=>setTimeout(r,1500));
  }
  drawToCanvas(ctx,w,h);
  if(!state.flashOn){
    shutterFlash.style.opacity='.85';playShutterSound();
    setTimeout(()=>shutterFlash.style.opacity='0',60);
  }else{
    playShutterSound();
    await new Promise(r=>setTimeout(r,2000));
    fullscreenFlash.style.opacity='0';
  }
  canvas.toBlob(b=>{if(b){downloadBlob(b,`photo_${Date.now()}.png`);showToast('Đã lưu ảnh')}},'image/png',.92);
}

function startRecording(){
  if(!state.stream||state.isRecording||!video.videoWidth) return;
  const w=video.videoWidth,h=video.videoHeight;
  recCanvas.width=w;recCanvas.height=h;
  const drawLoop=()=>{drawToCanvas(recCtx,w,h);state.recAnimId=requestAnimationFrame(drawLoop)};
  drawLoop();
  const canvasStream=recCanvas.captureStream(30);
  const audioTracks=state.stream.getAudioTracks();
  if(audioTracks.length) canvasStream.addTrack(audioTracks[0]);
  state.recordedChunks=[];
  const mimeCandidates = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  let mime = '';
  for(const t of mimeCandidates){
    if(MediaRecorder.isTypeSupported(t)){ mime = t; break; }
  }
  if(!mime){showToast('Trình duyệt không hỗ trợ quay video');cancelAnimationFrame(state.recAnimId);return}
  try{state.mediaRecorder=new MediaRecorder(canvasStream,{mimeType:mime,videoBitsPerSecond:2500000})}
  catch(e){showToast('Không thể quay video');cancelAnimationFrame(state.recAnimId);return}
  state.mediaRecorder.ondataavailable=e=>{if(e.data?.size)state.recordedChunks.push(e.data)};
  state.mediaRecorder.onstop=()=>{
    cancelAnimationFrame(state.recAnimId);
    const blob=new Blob(state.recordedChunks,{type:mime});
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    downloadBlob(blob, `video_${Date.now()}.${ext}`);
    showToast('Đã lưu video (.' + ext + ')');
    state.recordedChunks=[];
  };
  state.mediaRecorder.start(200);
  state.isRecording=true;shutter.classList.add('recording');
  recTimerEl.classList.add('recording');recTimerEl.style.display='block';startRecTimer();
  document.getElementById('app').classList.add('recording-active');
  closeAllMenus();
}
function stopRecording(){
  if(!state.isRecording||!state.mediaRecorder) return;
  state.mediaRecorder.stop();state.isRecording=false;
  shutter.classList.remove('recording');
  recTimerEl.classList.remove('recording');recTimerEl.style.display='none';stopRecTimer();
  document.getElementById('app').classList.remove('recording-active');
}
let recInterval=null,recSeconds=0;
function startRecTimer(){
  recSeconds=0;recTimerEl.textContent='00:00:00';
  recInterval=setInterval(()=>{
    recSeconds++;
    const h=String(Math.floor(recSeconds/3600)).padStart(2,'0');
    const m=String(Math.floor((recSeconds%3600)/60)).padStart(2,'0');
    const s=String(recSeconds%60).padStart(2,'0');
    recTimerEl.textContent=`${h}:${m}:${s}`;
  },1000);
}
function stopRecTimer(){clearInterval(recInterval);recInterval=null}

/* ===== Mic level meter (Web Audio) ===== */
let micAudioCtx = null;
let micAnalyser = null;
let micSource = null;
let micRaf = null;
const micMeter = document.getElementById('mic-meter');
const micBar = document.getElementById('mic-bar');

function startMicMeter(){
  stopMicMeter();
  const track = state.stream?.getAudioTracks()?.find(t => t.readyState === 'live');
  if(!track || !micMeter || !micBar) return;
  try{
    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    micSource = micAudioCtx.createMediaStreamSource(new MediaStream([track]));
    micAnalyser = micAudioCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    micAnalyser.smoothingTimeConstant = 0.6;
    micSource.connect(micAnalyser);
    // không connect destination → không phát loa, không feedback
    micMeter.classList.add('show');
    const data = new Uint8Array(micAnalyser.fftSize);
    const loop = () => {
      if(!micAnalyser) return;
      micAnalyser.getByteTimeDomainData(data);
      // RMS
      let sum = 0;
      for(let i = 0; i < data.length; i++){
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      // scale: 0~0.02 im lặng, 0.25+ rất to
      let level = Math.min(1, rms * 4.5);
      micBar.style.width = (level * 100) + '%';
      if(level < 0.35) micBar.style.background = '#34c759';
      else if(level < 0.65) micBar.style.background = '#ff9500';
      else micBar.style.background = '#ff3b30';
      micRaf = requestAnimationFrame(loop);
    };
    micRaf = requestAnimationFrame(loop);
  }catch(e){ console.warn('Mic meter', e); }
}

function stopMicMeter(){
  if(micRaf){ cancelAnimationFrame(micRaf); micRaf = null; }
  try{ micSource && micSource.disconnect(); }catch(e){}
  try{ micAnalyser && micAnalyser.disconnect(); }catch(e){}
  try{ micAudioCtx && micAudioCtx.close(); }catch(e){}
  micSource = null; micAnalyser = null; micAudioCtx = null;
  if(micMeter) micMeter.classList.remove('show');
  if(micBar){ micBar.style.width = '0%'; micBar.style.background = '#34c759'; }
}


async function setMode(mode){
  if(state.isRecording){showToast('Hãy dừng quay video trước');return}
  if(mode === state.mode) return;
  stopQRScan();closeAllMenus();
  const prev = state.mode;
  // Hiệu ứng chuyển chế độ
  cameraFrame.classList.add('mode-switching');
  await new Promise(r => setTimeout(r, 120));
  state.mode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));

  if(mode==='video'){
    shutter.classList.add('video-mode');
    shutter.classList.remove('hidden-mode');
    qrHint.style.display='none';
    const hasAudio = state.stream?.getAudioTracks().some(t=>t.readyState==='live');
    if(!hasAudio) await startCamera(true);
    startMicMeter();
  } else {
    stopMicMeter();
    if(prev==='video' && state.stream){
      state.stream.getAudioTracks().forEach(t=>{
        try{ t.stop(); }catch(e){}
      });
    }
    shutter.classList.remove('video-mode');
    if(mode==='qr'){
      shutter.classList.add('hidden-mode');
      qrHint.style.display='block';
      startQRScan();
    } else {
      shutter.classList.remove('hidden-mode');
      qrHint.style.display='none';
    }
  }
  updateShutterColor();
  requestAnimationFrame(() => {
    setTimeout(() => cameraFrame.classList.remove('mode-switching'), 80);
  });
}

// Zoom
zoomSlider.addEventListener('input',()=>{
  state.zoom=parseFloat(zoomSlider.value);
  if(state.zoom<=1.05){state.panX=0;state.panY=0}
  clampPan();applyVideoTransform();
  const zl=document.getElementById('zoom-label');
  if(zl){
    if(state.zoom<=1.05){ zl.style.display='none'; }
    else {
      zl.style.display='block';
      const z = state.zoom;
      zl.textContent = (Math.abs(z - Math.round(z)) < 0.05 ? Math.round(z) : z.toFixed(1).replace('.',',')) + 'x';
    }
  }
});

// Pan
videoWrap.addEventListener('pointerdown',e=>{
  if(state.zoom<=1.05) return;
  state.isPanning=true;state.panStartX=e.clientX;state.panStartY=e.clientY;
  state.panOriginX=state.panX;state.panOriginY=state.panY;
  videoWrap.setPointerCapture(e.pointerId);
});
videoWrap.addEventListener('pointermove',e=>{
  if(!state.isPanning) return;
  state.panX=state.panOriginX+(e.clientX-state.panStartX);
  state.panY=state.panOriginY+(e.clientY-state.panStartY);
  clampPan();applyVideoTransform();
});
videoWrap.addEventListener('pointerup',()=>{state.isPanning=false});
videoWrap.addEventListener('pointercancel',()=>{state.isPanning=false});

// Modes
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
shutter.addEventListener('click',()=>{
  if(state.mode==='video') state.isRecording?stopRecording():startRecording();
  else if(state.mode==='photo') capturePhoto();
});

// Flash
flashBtn.addEventListener('click',()=>{
  state.flashOn=!state.flashOn;
  flashBtn.classList.toggle('active',state.flashOn);
  updateBackground();
  if(state.flashOn) showToast('Hãy bật độ sáng tối đa để có hiệu quả tốt nhất');
});
colorBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const open = colorPalette.classList.contains('show');
  closeAllMenus();
  if(!open){ placePopup(colorPalette,colorBtn); colorPalette.classList.add('show'); }
});
document.querySelectorAll('.color-swatch').forEach(sw=>{
  sw.addEventListener('click',()=>{
    document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
    sw.classList.add('selected');
    state.flashColor=sw.dataset.color;
    colorDot.style.background=state.flashColor;
    updateBackground();
    colorPalette.classList.remove('show');
  });
});

// Timer (làm lại từ đầu)
timerBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const open = timerMenu.classList.contains('show');
  closeAllMenus();
  if(!open){ placePopup(timerMenu,timerBtn); timerMenu.classList.add('show'); }
});
document.querySelectorAll('.timer-opt').forEach(opt=>{
  opt.addEventListener('click',()=>{
    document.querySelectorAll('.timer-opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    state.timerSec=parseInt(opt.dataset.sec,10);
    timerBtn.classList.toggle('active',state.timerSec>0);
    timerMenu.classList.remove('show');
    if(state.timerSec>0) showToast('Hẹn giờ '+state.timerSec+' giây');
  });
});

// Aspect
aspectBtn.addEventListener('click',()=>{
  state.forceAspect=state.forceAspect==='16:9'?'4:3':'16:9';
  aspectBtn.textContent=state.forceAspect;
  adjustAspectRatio();
  showToast('Tỷ lệ: '+state.forceAspect);
});

// EV
evBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const open = evPopup.classList.contains('show');
  closeAllMenus();
  if(!open){ placePopup(evPopup,evBtn); evPopup.classList.add('show'); }
});
evSlider.addEventListener('input',()=>{
  state.ev=parseFloat(evSlider.value);
  applyFilters();
});

// Saturation
satBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const open = satPopup.classList.contains('show');
  closeAllMenus();
  if(!open){ placePopup(satPopup,satBtn); satPopup.classList.add('show'); }
});
satSlider.addEventListener('input',()=>{
  state.sat=parseFloat(satSlider.value);
  applyFilters();
});

// Temperature
tempBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const open = tempPopup.classList.contains('show');
  closeAllMenus();
  if(!open){ placePopup(tempPopup,tempBtn); tempPopup.classList.add('show'); }
});
tempSlider.addEventListener('input',()=>{
  state.temp=parseFloat(tempSlider.value);
  applyFilters();
});

document.getElementById('reset-btn').addEventListener('click', e => {
  e.stopPropagation();
  state.ev = 0; evSlider.value = 0;
  state.sat = 1; satSlider.value = 1;
  state.temp = 0; tempSlider.value = 0;
  applyFilters();
  closeAllMenus();
  showToast('Đã khôi phục mặc định');
});

flipVBtn.addEventListener('click',()=>{state.flipV=!state.flipV;applyVideoTransform()});
flipHBtn.addEventListener('click',()=>{state.flipH=!state.flipH;applyVideoTransform()});

document.getElementById('qr-close').addEventListener('click',()=>{
  qrPopup.classList.remove('show');
  if(state.mode==='qr') startQRScan();
});
document.getElementById('qr-copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(qrResult.value);showToast('Đã sao chép')}
  catch{qrResult.select();document.execCommand('copy');showToast('Đã sao chép')}
});

document.addEventListener('click',e=>{
  const menus=[colorPalette,timerMenu,evPopup,satPopup,tempPopup];
  const btns=[colorBtn,timerBtn,evBtn,satBtn,tempBtn];
  let inside=false;
  for(const m of menus) if(m.contains(e.target)) inside=true;
  for(const b of btns) if(b===e.target||b.contains(e.target)) inside=true;
  if(!inside) closeAllMenus();
});
window.addEventListener('resize',()=>adjustAspectRatio());

if(navigator.mediaDevices?.getUserMedia) startCamera(false);
else{noCamera.classList.remove('hidden');showToast('Trình duyệt không hỗ trợ camera')}
</script>
</body>
</html>
